<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" font-family="Arial, Helvetica, sans-serif" font-size="14">
<rect width="1180" height="760" fill="#ffffff"/>
<text x="20" y="30" font-size="20" font-weight="bold">Wo die Spur abreisst: die Nachrichtenerweiterung als Kästchen</text>
<text x="20" y="52" fill="#444">Jedes Kästchen = ein 32-Bit-Wort. Grün = bekannt (Konstante/Header), Rot = unbekannt, Orange = aus Unbekanntem BERECHNET. Pfeile = „fließt hinein" (mit Additionen und Überträgen).</text>

<!-- Legende -->
<rect x="860" y="62" width="18" height="18" fill="#bfe3bf" stroke="#2a7a2a"/><text x="884" y="76">bekannt</text>
<rect x="960" y="62" width="18" height="18" fill="#f4b8b8" stroke="#b02020"/><text x="984" y="76">unbekannt</text>
<rect x="1060" y="62" width="18" height="18" fill="#ffd9a0" stroke="#c07000"/><text x="1084" y="76">berechnet</text>

<!-- ===== Erste Anwendung ===== -->
<text x="20" y="110" font-size="16" font-weight="bold">Erste Anwendung (Header → H1): Eingabe W0..W15</text>
<g id="h1">
<!-- W0..W15 -->
<rect x="20"  y="120" width="56" height="34" fill="#bfe3bf" stroke="#2a7a2a"/><text x="28" y="142">W0</text>
<rect x="84"  y="120" width="56" height="34" fill="#bfe3bf" stroke="#2a7a2a"/><text x="92" y="142">W1</text>
<rect x="148" y="120" width="56" height="34" fill="#bfe3bf" stroke="#2a7a2a"/><text x="156" y="142">W2</text>
<rect x="212" y="120" width="56" height="34" fill="#f4b8b8" stroke="#b02020" stroke-width="2"/><text x="218" y="142" font-weight="bold">W3</text>
<text x="212" y="170" font-size="11" fill="#b02020">Nonce</text>
<rect x="276" y="120" width="56" height="34" fill="#bfe3bf" stroke="#2a7a2a"/><text x="284" y="142">W4</text>
<text x="340" y="142" fill="#2a7a2a">… W5 … W15 = Auffüllung, alle bekannt</text>
<!-- erweiterte -->
<rect x="20"  y="210" width="70" height="34" fill="#bfe3bf" stroke="#2a7a2a"/><text x="28" y="232">W16</text>
<text x="20" y="260" font-size="11" fill="#2a7a2a">= σ1(W14)+W9+σ0(W1)+W0 → bekannt</text>
<rect x="250" y="210" width="70" height="34" fill="#bfe3bf" stroke="#2a7a2a"/><text x="258" y="232">W17</text>
<text x="250" y="260" font-size="11" fill="#2a7a2a">= σ1(W15)+W10+σ0(W2)+W1 → bekannt</text>
<rect x="480" y="210" width="70" height="34" fill="#ffd9a0" stroke="#c07000" stroke-width="2"/><text x="488" y="232" font-weight="bold">W18</text>
<text x="480" y="260" font-size="11" fill="#c07000">= σ1(W16)+W11+σ0(W3)+W2 → hängt an W3</text>
<rect x="720" y="210" width="70" height="34" fill="#ffd9a0" stroke="#c07000" stroke-width="2"/><text x="728" y="232" font-weight="bold">W19</text>
<text x="720" y="260" font-size="11" fill="#c07000">= σ1(W17)+W12+σ0(W4)+W3 → hängt an W3</text>
<text x="960" y="232" fill="#c07000">W20 … W63: alle hängen an W3</text>
<!-- Pfeile von W3 -->
<line x1="240" y1="154" x2="505" y2="208" stroke="#b02020" stroke-width="2" marker-end="url(#a)"/>
<line x1="240" y1="154" x2="745" y2="208" stroke="#b02020" stroke-width="2" marker-end="url(#a)"/>
<!-- Runden -->
<text x="20" y="300" font-size="13">Rundenwort geht hinein in:  Runde 1 ← W0 … Runde 4 ← <tspan fill="#b02020" font-weight="bold">W3 (Nonce)</tspan> … Runde 17 ← W16 (bekannt) · Runde 18 ← W17 (bekannt) · <tspan fill="#c07000" font-weight="bold">Runde 19 ← W18 (berechnet aus Nonce)</tspan></text>
<text x="20" y="322" font-size="13" font-weight="bold" fill="#c07000">Gemessen: Erweiterung nur hier → Ableitung klappt bei 17 und 18 Runden, reisst bei 19 ab.  Genau die Runde, in der W18 zum ersten Mal gebraucht wird.</text>
</g>

<!-- ===== Zweite Anwendung ===== -->
<text x="20" y="380" font-size="16" font-weight="bold">Zweite Anwendung (H1 → H2): Eingabe W0..W7 = der Zwischenhash H1, W8..W15 = Auffüllung</text>
<g id="h2">
<rect x="20"  y="390" width="56" height="34" fill="#f4b8b8" stroke="#b02020" stroke-width="2"/><text x="28" y="412" font-weight="bold">W0</text>
<rect x="84"  y="390" width="56" height="34" fill="#f4b8b8" stroke="#b02020" stroke-width="2"/><text x="92" y="412" font-weight="bold">W1</text>
<rect x="148" y="390" width="56" height="34" fill="#f4b8b8" stroke="#b02020"/><text x="156" y="412">W2</text>
<text x="212" y="412" fill="#b02020">… W7: H1, alles unbekannt (hängt an der Nonce über 64 Runden)</text>
<rect x="640" y="390" width="56" height="34" fill="#bfe3bf" stroke="#2a7a2a"/><text x="648" y="412">W8</text>
<text x="704" y="412" fill="#2a7a2a">… W15 = Auffüllung, bekannt (0x80000000, 0, …, 256)</text>
<rect x="20"  y="480" width="70" height="34" fill="#ffd9a0" stroke="#c07000" stroke-width="2"/><text x="28" y="502" font-weight="bold">W16</text>
<text x="20" y="530" font-size="11" fill="#c07000">= σ1(W14)+W9+σ0(W1)+W0 → hängt an W0 UND W1</text>
<rect x="320" y="480" width="70" height="34" fill="#ffd9a0" stroke="#c07000" stroke-width="2"/><text x="328" y="502" font-weight="bold">W17</text>
<text x="320" y="530" font-size="11" fill="#c07000">= σ1(W15)+W10+σ0(W2)+W1 → hängt an W1, W2</text>
<text x="620" y="502" fill="#c07000">W18 … W63: alle hängen an H1</text>
<line x1="48" y1="424" x2="48" y2="478" stroke="#b02020" stroke-width="2" marker-end="url(#a)"/>
<line x1="112" y1="424" x2="60" y2="478" stroke="#b02020" stroke-width="2" marker-end="url(#a)"/>
<line x1="112" y1="424" x2="350" y2="478" stroke="#b02020" stroke-width="2" marker-end="url(#a)"/>
<line x1="176" y1="424" x2="360" y2="478" stroke="#b02020" stroke-width="2" marker-end="url(#a)"/>
<text x="20" y="570" font-size="13">Rundenwort geht hinein in:  Runde 1 ← W0 … Runde 16 ← W15 (bekannt) · <tspan fill="#c07000" font-weight="bold">Runde 17 ← W16 (berechnet aus H1)</tspan></text>
<text x="20" y="592" font-size="13" font-weight="bold" fill="#c07000">Gemessen: Erweiterung nur hier → reisst bei 17 Runden ab.  Genau die Runde, in der W16 zum ersten Mal gebraucht wird.</text>
</g>

<!-- ===== Das Kästchen selbst ===== -->
<rect x="20" y="620" width="1140" height="120" fill="#f7f7f7" stroke="#888"/>
<text x="36" y="645" font-size="15" font-weight="bold">Das eine Kästchen, in dem es passiert (Beispiel W16 der zweiten Anwendung):</text>
<text x="36" y="672" font-size="13">W16 = <tspan fill="#2a7a2a">σ1(W14)</tspan> + <tspan fill="#2a7a2a">W9</tspan> + <tspan fill="#b02020" font-weight="bold">σ0(W1)</tspan> + <tspan fill="#b02020" font-weight="bold">W0</tspan>      σ0(x) = rot7(x) ⊕ rot18(x) ⊕ shr3(x)   — nur Verdrahtung und XOR, jedes Bit von σ0(W1) ist XOR von 3 Bits aus W1</text>
<text x="36" y="696" font-size="13">Die zwei roten Summanden werden mit Übertragskette addiert: Bit i von W16 hängt an Bit i von W0, an drei Bits von W1 und am Übertrag aus allen tieferen Bits.</text>
<text x="36" y="720" font-size="13">Dasselbe W0 steckt zugleich in Runde 1, dasselbe W1 in Runde 2 und in W17. Ein Kästchen pro Bit kann „W0 hier = W0 dort" nicht festhalten – genau das geht verloren.</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b02020"/></marker></defs>
</svg>
