name: Offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quick:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -I tools/manifest.py --check
      - run: python -B -I tests/test_regression.py
      - run: python -B -I tests/test_schnell.py
      - run: python -B -I beispiele/01_reduzierte_runden.py 8
      - run: python -B -I beispiele/02_genesis_zeuge.py
  linux-experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -B -I experimente/skripte/lauf_zielhash_fix.py
      - run: python -B -I experimente/skripte/lauf_runden.py
      - run: python -B -I tests/test_experiment_results.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-experiment-results
          path: experimente/skripte/ERGEBNIS*.json
